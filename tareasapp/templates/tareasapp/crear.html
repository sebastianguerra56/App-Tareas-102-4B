<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear tarea</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        form {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 6px;
            color: #34495e;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input[type="checkbox"] {
            margin-right: 8px;
        }

        button {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #2980b9;
        }
        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>Crear nueva tarea</h1>

    <form id="formTarea">

        <label for="titulo">Título:</label>
        <br>
        <input type="text" id="titulo" name="titulo" required>

        <br><br>

        <label for="descripcion">Descripción:</label>
        <br>
        <textarea id="descripcion" name="descripcion" required></textarea>

        <br><br>

        <label>
            <input type="checkbox" id="completada" name="completada">
            Tarea completada
        </label>

        <br><br>

        <button type="submit">
            Guardar tarea
        </button>

    </form>

    <p id="mensaje"></p>

    <br>

    <a href="/tareas/">Volver al inicio</a>

    <script>
        const formulario = document.getElementById('formTarea');
        const mensaje = document.getElementById('mensaje');

        formulario.addEventListener('submit', async function(event) {

            // Evita el envío tradicional del formulario
            event.preventDefault();

            // Recupera el token obtenido durante el login
            const token = sessionStorage.getItem('token');

            if (!token) {
                mensaje.textContent =
                    'No hay sesión activa. Inicia sesión nuevamente.';
                return;
            }

            // Captura los datos del formulario
            const titulo = document.getElementById('titulo').value;
            const descripcion = document.getElementById('descripcion').value;
            const completada = document.getElementById('completada').checked;

            // Construye el objeto que enviaremos a Django
            const tarea = {
                titulo: titulo,
                descripcion: descripcion,
                completada: completada
            };

            try {
                const respuesta = await fetch('/api/tareas/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${token}`
                    },
                    body: JSON.stringify(tarea)
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    mensaje.textContent = 'Tarea creada correctamente.';

                    // Redirige a la página que lista las tareas
                    window.location.href = '/tareas/';
                } else if (respuesta.status === 401 ||
                        respuesta.status === 403) {
                    mensaje.textContent =
                        'Tu sesión no es válida. Inicia sesión nuevamente.';
                } else {
                    mensaje.textContent =
                        datos.error || 'No se pudo crear la tarea.';
                }

            } catch (error) {
                mensaje.textContent =
                    'Error de conexión con el servidor.';
                console.error(error);
            }

        });
    </script>

</body>
</html>
