<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Eliminar tarea</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin-top: 40px;
        }

        p {
            text-align: center;
            font-size: 18px;
        }

        h2 {
            text-align: center;
            color: #e74c3c;
        }

        form {
            text-align: center;
            margin-top: 20px;
        }

        button {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #3498db;
        }   
    </style>
</head>

<body>

    <h1>🗑️ Eliminar tarea</h1>

    <p>
        ¿Estás seguro de que quieres eliminar esta tarea?
    </p>

    <h2>{{ tarea.titulo }}</h2>

    <p>
        {{ tarea.descripcion }}
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Sí, eliminar
        </button>

    </form>

    <br>

    <a href="/">
        ← Cancelar y volver al inicio
    </a>

</body>

</html>
